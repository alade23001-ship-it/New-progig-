<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ibrahim Proman | Digital Services Marketplace</title>

<meta name="description" content="Professional website creation, resume writing, graphic design and digital services by Ibrahim Proman.">

<style>
:root {
  --blue: #0757d8;
  --blue2: #1683ff;
  --dark: #101d38;
  --muted: #718096;
  --light: #f4f7fc;
  --border: #e3e9f2;
  --white: #ffffff;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: var(--dark);
  background: white;
}

button, input, textarea, select {
  font: inherit;
}

button, a {
  -webkit-tap-highlight-color: transparent;
}

a {
  text-decoration: none;
  color: inherit;
}

button {
  cursor: pointer;
}

.topbar {
  background: #082e7a;
  color: white;
  padding: 10px;
  text-align: center;
  font-size: 12px;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 15px 5%;
  background: white;
  border-bottom: 1px solid var(--border);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 21px;
  font-weight: 800;
  white-space: nowrap;
}

.logo-icon {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  color: white;
  background: linear-gradient(135deg, #1683ff, #0647c9);
  font-size: 27px;
}

.logo span span {
  color: var(--blue);
}

.logo small {
  display: block;
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 2px;
  margin-top: 3px;
}

nav {
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 13px;
  font-weight: bold;
}

nav a:hover {
  color: var(--blue);
}

.btn {
  display: inline-block;
  padding: 12px 18px;
  border: 0;
  border-radius: 9px;
  font-weight: bold;
  text-align: center;
}

.primary {
  color: white;
  background: var(--blue);
}

.primary:hover {
  background: #0646ae;
}

.outline {
  background: white;
  color: var(--blue);
  border: 1px solid var(--border);
}

.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 35px;
  padding: 65px 6%;
  background: linear-gradient(120deg, white 45%, #edf5ff);
}

.eyebrow {
  color: var(--blue);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
}

.hero h1 {
  font-size: clamp(38px, 5vw, 62px);
  line-height: 1.08;
  letter-spacing: -2px;
  margin: 20px 0;
}

.hero h1 span {
  color: var(--blue);
}

.hero p {
  max-width: 530px;
  color: var(--muted);
  line-height: 1.8;
  font-size: 15px;
}

.search {
  display: flex;
  gap: 8px;
  padding: 6px;
  margin-top: 25px;
  max-width: 550px;
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 10px 30px #12335b0d;
}

.search input {
  flex: 1;
  width: 50%;
  min-width: 0;
  padding: 12px;
  border: 0;
  outline: none;
  font-size: 13px;
}

.hero-art {
  min-height: 340px;
  display: grid;
  place-items: center;
  padding: 30px;
  border-radius: 30px;
  background: linear-gradient(145deg, #0757d8, #1683ff);
  color: white;
  box-shadow: 0 25px 60px #0757d82c;
  position: relative;
  overflow: hidden;
}

.hero-art:before,
.hero-art:after {
  content: "";
  position: absolute;
  border: 1px solid #ffffff40;
  border-radius: 50%;
  width: 300px;
  height: 300px;
}

.hero-art:after {
  width: 420px;
  height: 420px;
}

.hero-content {
  position: relative;
  z-index: 1;
  text-align: center;
}

.hero-content .big {
  font-size: 80px;
  margin-bottom: 15px;
}

.hero-content h2 {
  font-size: 28px;
  margin: 10px 0;
}

.hero-content p {
  color: #e0edff;
  font-size: 13px;
}

.trust {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
  padding: 22px 6%;
  background: var(--light);
  border-bottom: 1px solid var(--border);
}

.trust div {
  font-size: 12px;
  font-weight: bold;
  color: #536580;
}

.trust strong {
  color: var(--blue);
  font-size: 20px;
  display: block;
  margin-bottom: 6px;
}

.section {
  padding: 65px 5%;
  max-width: 1400px;
  margin: auto;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 15px;
  margin-bottom: 25px;
}

.section h2 {
  font-size: 32px;
  letter-spacing: -1px;
  margin: 10px 0;
}

.section-heading p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.filters {
  display: flex;
  gap: 9px;
  overflow-x: auto;
  padding-bottom: 18px;
}

.filter {
  white-space: nowrap;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  background: white;
  color: #536580;
  font-size: 12px;
  font-weight: bold;
}

.filter.active {
  color: var(--blue);
  background: #edf4ff;
  border-color: #bdd6ff;
}

.gigs {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
}

.gig {
  border: 1px solid var(--border);
  border-radius: 13px;
  overflow: hidden;
  background: white;
  transition: .2s;
}

.gig:hover {
  transform: translateY(-4px);
  box-shadow: 0 15px 35px #142d5015;
}

.gig img {
  display: block;
  width: 100%;
  height: 190px;
  object-fit: cover;
  background: #edf3fc;
}

.gig-body {
  padding: 16px;
}

.seller {
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 12px;
}

.seller b {
  color: var(--dark);
}

.gig h3 {
  font-size: 15px;
  line-height: 1.5;
  min-height: 45px;
  margin: 10px 0;
}

.gig p {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
  min-height: 55px;
}

.gig-meta {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 12px 0;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 10px;
}

.gig-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 13px 16px;
  border-top: 1px solid var(--border);
}

.gig-bottom small {
  display: block;
  color: var(--muted);
  font-size: 9px;
  margin-bottom: 5px;
}

.gig-bottom strong {
  font-size: 19px;
}

.gig-bottom button {
  background: #edf4ff;
  color: var(--blue);
  border: 0;
  border-radius: 8px;
  padding: 10px;
  font-size: 11px;
  font-weight: bold;
}

.gig-bottom button:hover {
  background: var(--blue);
  color: white;
}

.empty {
  padding: 40px;
  text-align: center;
  color: var(--muted);
}

.how {
  background: var(--light);
  max-width: none;
}

.steps {
  max-width: 1200px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.step {
  background: white;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 23px;
}

.step span {
  color: var(--blue);
  font-weight: bold;
  font-size: 22px;
}

.step h3 {
  font-size: 15px;
}

.step p {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.8;
}

.about {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 25px;
  flex-wrap: wrap;
}

.about p {
  max-width: 650px;
  color: var(--muted);
  line-height: 1.8;
  font-size: 14px;
}

.cta {
  margin: 0 5% 60px;
  padding: 35px;
  border-radius: 18px;
  background: linear-gradient(120deg, #082e7a, #0757d8, #1683ff);
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.cta h2 {
  font-size: 27px;
  margin: 10px 0;
}

.cta p {
  color: #e0edff;
  font-size: 13px;
  line-height: 1.7;
}

footer {
  padding: 30px 5%;
  border-top: 1px solid var(--border);
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  line-height: 2;
}

footer b {
  color: var(--blue);
}

.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: #08172bd9;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 15px;
  overflow-y: auto;
}

.modal.show {
  display: flex;
}

.modal-box {
  position: relative;
  width: 100%;
  max-width: 650px;
  max-height: 92vh;
  overflow-y: auto;
  background: white;
  border-radius: 16px;
  padding: 25px;
}

.close {
  float: right;
  border: 0;
  border-radius: 50%;
  width: 35px;
  height: 35px;
  font-size: 22px;
  background: #edf2f9;
}

.modal-box h2 {
  font-size: 24px;
}

.modal-box p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.packages {
  display: grid;
  gap: 10px;
  margin: 20px 0;
}

.package {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 15px;
  cursor: pointer;
}

.package.selected {
  background: #edf4ff;
  border-color: var(--blue);
}

.package small {
  display: block;
  color: var(--muted);
  margin-top: 5px;
}

.package strong {
  color: var(--blue);
  font-size: 19px;
}

.full {
  width: 100%;
  margin-top: 8px;
}

.form {
  display: grid;
  gap: 12px;
  margin-top: 20px;
}

.form label {
  display: grid;
  gap: 6px;
  font-size: 12px;
  font-weight: bold;
}

.form input,
.form textarea,
.form select {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: none;
}

.form input:focus,
.form textarea:focus,
.form select:focus {
  border-color: var(--blue);
}

.admin-item {
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  padding: 12px 0;
  font-size: 12px;
}

.admin-item span {
  flex: 1;
}

.admin-item button {
  padding: 7px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 6px;
}

.notice {
  background: #fff6df;
  padding: 12px;
  border-radius: 8px;
  color: #795d17;
  font-size: 11px;
  line-height: 1.7;
  margin-top: 15px;
}

@media(max-width:900px) {
  .hero {
    padding: 45px 5%;
  }

  .gigs {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  nav {
    gap: 10px;
  }
}

@media(max-width:650px) {
  header {
    flex-wrap: wrap;
  }

  header nav {
    width: 100%;
    justify-content: space-between;
    order: 3;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .hero {
    grid-template-columns: 1fr;
  }

  .hero h1 {
    font-size: 43px;
  }

  .hero-art {
    min-height: 270px;
  }

  .trust {
    grid-template-columns: repeat(2, 1fr);
  }

  .gigs {
    grid-template-columns: 1fr;
  }

  .gig img {
    height: 210px;
  }

  .steps {
    grid-template-columns: repeat(2, 1fr);
  }

  .cta {
    flex-direction: column;
    align-items: flex-start;
    padding: 25px;
  }

  .section {
    padding: 45px 5%;
  }
}

@media(max-width:390px) {
  .steps {
    grid-template-columns: 1fr;
  }

  .logo {
    font-size: 18px;
  }

  .hero h1 {
    font-size: 37px;
  }
}
</style>
</head>

<body>

<div class="topbar">
Professional Digital Services · Serving Clients Worldwide
</div>

<header>
  <a href="#" class="logo">
    <span class="logo-icon">P</span>
    <span>Ibrahim<span>Proman</span><small>DIGITAL SERVICES</small></span>
  </a>

  <nav>
    <a href="#gigs">Services</a>
    <a href="#how">How
